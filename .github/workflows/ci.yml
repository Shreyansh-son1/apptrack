name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json says, so CI and
      # local runs use the same dependency versions.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image (the Dockerfile typechecks and builds inside it)
        run: docker build --tag apptrack:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name apptrack -p 3001:3001 apptrack:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/api/health; then exit 0; fi
            sleep 1
          done
          docker logs apptrack
          exit 1
